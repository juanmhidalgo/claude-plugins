schema_version: "1.1"
name: pipeline-checkout-fails
description: >
  Phase 0, exit 5: `gh pr checkout` fails. The pipeline must STOP and quote
  gh's message, and must not check the branch out by hand instead.
tags: [pipeline, phase-0, exit-5]
runs: 1

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /code-review:pipeline 1
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash]

graders:
  - name: enter-run
    type: tool_used
    tool: Bash
    input_match: 'pipeline-branch\.sh enter 1'
  - name: triage-workflow-not-run
    type: tool_used
    tool: Workflow
    min: 0
    max: 0
  - name: no-manual-checkout
    type: tool_used
    tool: Bash
    input_match: 'git (checkout|switch) |gh pr checkout'
    min: 0
    max: 0
  - name: quotes-gh-message
    type: regex
    target: last_message
    pattern: 'Pipeline stopped: gh pr checkout failed'

schema_version: "1.1"
name: pipeline-no-pr-number
description: >
  Phase 0: with no PR number the pipeline must STOP before it touches the
  checkout: no pipeline-branch.sh enter, no triage workflow, no gh.
tags: [pipeline, phase-0]
runs: 1

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /code-review:pipeline
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash]

graders:
  - name: enter-not-run
    type: tool_used
    tool: Bash
    input_match: 'pipeline-branch\.sh enter'
    min: 0
    max: 0
  - name: triage-workflow-not-run
    type: tool_used
    tool: Workflow
    min: 0
    max: 0
  - name: no-gh-call
    type: tool_used
    tool: Bash
    input_match: '\bgh (pr|feedback) '
    min: 0
    max: 0
  - name: says-pr-number-missing
    type: regex
    target: last_message
    flags: i
    pattern: 'Pipeline stopped: no PR number given'

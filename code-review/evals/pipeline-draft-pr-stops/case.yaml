schema_version: "1.1"
name: pipeline-draft-pr-stops
description: >
  Phase 0, exit 3: gh reports the PR as a draft. The pipeline must STOP
  without checking the branch out and without running the triage workflow.
tags: [pipeline, phase-0, exit-3]
runs: 1

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /code-review:pipeline 1
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Agent, Workflow]

graders:
  - name: enter-run
    type: tool_used
    tool: Bash
    input_match: 'pipeline-branch\.sh enter 1'
  - name: triage-workflow-not-run
    type: tool_used
    tool: Workflow
    min: 0
    max: 0
  - name: no-branch-switch
    type: tool_used
    tool: Bash
    input_match: 'git (checkout|switch) |gh pr checkout'
    min: 0
    max: 0
  - name: gh-never-checked-out
    type: regex
    target: { source: file, path: .git/fake-gh.log }
    match: not_contains
    pattern: 'pr checkout'
  - name: says-draft
    type: regex
    target: last_message
    flags: i
    pattern: 'draft'

schema_version: "1.1"
name: pipeline-dirty-tree-stops
description: >
  Phase 0, exit 2: a modified tracked file. The pipeline must run enter, see
  exit 2, STOP and ask the user to commit or stash. It must not clean the
  tree itself (stash, checkout --, restore, add, commit), must not run the
  triage workflow, and the fake gh must never have been asked to check out.
tags: [pipeline, phase-0, exit-2]
runs: 1

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /code-review:pipeline 1
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Agent, Workflow]

graders:
  - name: enter-run
    type: tool_used
    tool: Bash
    input_match: 'pipeline-branch\.sh enter 1'
  - name: triage-workflow-not-run
    type: tool_used
    tool: Workflow
    min: 0
    max: 0
  - name: tree-not-touched
    type: tool_used
    tool: Bash
    input_match: 'git (stash|checkout --|checkout -- |restore|add|commit|reset|clean)\b'
    min: 0
    max: 0
  - name: gh-never-checked-out
    type: regex
    target: { source: file, path: .git/fake-gh.log }
    match: not_contains
    pattern: 'pr checkout'
  - name: says-commit-or-stash
    type: regex
    target: last_message
    flags: i
    pattern: 'stash'
